name: Update ClasseViva calendar

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Create output folder
        run: mkdir -p output

      - name: Check secrets
        env:
          CLASSEVIVA_USERNAME: ${{ secrets.CLASSEVIVA_USERNAME }}
          CLASSEVIVA_PASSWORD: ${{ secrets.CLASSEVIVA_PASSWORD }}
        run: |
          test -n "$CLASSEVIVA_USERNAME" && echo "USERNAME presente" || echo "USERNAME MANCANTE"
          test -n "$CLASSEVIVA_PASSWORD" && echo "PASSWORD presente" || echo "PASSWORD MANCANTE"

      - name: Update calendar
        env:
          CLASSEVIVA_USERNAME: ${{ secrets.CLASSEVIVA_USERNAME }}
          CLASSEVIVA_PASSWORD: ${{ secrets.CLASSEVIVA_PASSWORD }}
        run: bun run index.ts

      - name: Save calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/agenda.ics registry.json
          git diff --cached --quiet || git commit -m "Update calendar"
          git push
